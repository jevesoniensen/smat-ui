<div class="container mat-typography">
  <h3>Medidas Corretivas</h3>

  <div *ngIf="!fiscalizacaoId()" class="alert error">
    <mat-icon>error</mat-icon>
    Contexto de fiscalização não encontrado.
    <button mat-button (click)="handleReturn()">Voltar</button>
  </div>

  <div *ngIf="fiscalizacaoId()">
    <mat-card class="section">
      <mat-card-header>
        <mat-card-title>{{ selectedId() ? 'Editar' : 'Nova' }} Medida Corretiva</mat-card-title>
      </mat-card-header>

      <mat-card-content class="mt-10">
        <form [formGroup]="medidaForm" (ngSubmit)="handleSave()" class="form-container">
          <mat-form-field appearance="fill" class="w-100">
            <mat-label>Tipo de Medida</mat-label>
            <mat-select formControlName="tipoMedidaVal">
              <mat-option *ngFor="let t of tiposMedida()" [value]="t.id">{{ t.nome }}</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="fill" class="w-100">
            <mat-label>Prazo (dias)</mat-label>
            <input matInput type="number" formControlName="prazoDias">
          </mat-form-field>

          <mat-form-field appearance="fill" class="w-100">
            <mat-label>Observação / Descrição</mat-label>
            <textarea matInput formControlName="observacao" rows="3"></textarea>
          </mat-form-field>

          <div class="actions-container">
            <button mat-button type="button" (click)="handleClear()" [disabled]="loading()">LIMPAR</button>
            <button mat-raised-button color="warn" type="button" *ngIf="selectedId()" (click)="handleDelete()" [disabled]="loading()">EXCLUIR</button>
            <button mat-raised-button color="primary" type="submit" [disabled]="medidaForm.invalid || loading()">
              {{ selectedId() ? 'ATUALIZAR' : 'ADICIONAR' }}
            </button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>

    <div class="section">
      <h4>Medidas Registradas</h4>
      <table mat-table [dataSource]="medidas()" class="mat-elevation-z1 w-100">
        <ng-container matColumnDef="tipo">
          <th mat-header-cell *matHeaderCellDef> Tipo </th>
          <td mat-cell *matCellDef="let m"> {{m.tipo}} </td>
        </ng-container>

        <ng-container matColumnDef="descricao">
          <th mat-header-cell *matHeaderCellDef> Descrição </th>
          <td mat-cell *matCellDef="let m"> {{m.descricao}} </td>
        </ng-container>

        <ng-container matColumnDef="prazoDias">
          <th mat-header-cell *matHeaderCellDef> Prazo (Dias) </th>
          <td mat-cell *matCellDef="let m"> {{m.prazoDias}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="handleSelect(row)" class="clickable-row"></tr>
      </table>
    </div>

    <div class="mt-20">
      <button mat-button (click)="handleReturn()">RETORNAR</button>
    </div>
  </div>
</div>
