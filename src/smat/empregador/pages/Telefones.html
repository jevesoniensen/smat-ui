<div class="container mat-typography">
  <h3>Telefones do Empregador</h3>

  <div *ngIf="loading()" class="acidente-loading">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Carregando...</p>
  </div>

  <div *ngIf="!loading()">
    <div *ngIf="!empregadorId()" class="alert error">
      <mat-icon>error</mat-icon>
      Contexto do empregador não encontrado.
      <button mat-button (click)="handleBack()">Voltar</button>
    </div>

    <div *ngIf="empregadorId()">
      <mat-card class="section">
        <mat-card-header>
          <mat-card-title>{{ telefoneId() ? 'Editar' : 'Novo' }} Telefone</mat-card-title>
          <mat-card-subtitle>Empresa: {{ empregador()?.razaoSocial }}</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content class="mt-10">
          <form [formGroup]="telefoneForm" (ngSubmit)="handleSave()" class="form-container">
            <div class="grid-form">
              <mat-form-field appearance="fill" class="w-100">
                <mat-label>DDD</mat-label>
                <input matInput formControlName="ddd" maxlength="2" placeholder="Ex: 11" required>
              </mat-form-field>

              <mat-form-field appearance="fill" class="w-100">
                <mat-label>Número</mat-label>
                <input matInput formControlName="numero" maxlength="9" placeholder="Ex: 999999999" required>
              </mat-form-field>
            </div>

            <mat-form-field appearance="fill" class="w-100">
              <mat-label>Descrição / Observação</mat-label>
              <input matInput formControlName="descricao" placeholder="Ex: Celular, Comercial" required>
            </mat-form-field>

            <div class="actions-container mt-10">
              <button mat-button type="button" (click)="handleClear()" [disabled]="loading()">LIMPAR</button>
              <button mat-raised-button color="warn" type="button" *ngIf="telefoneId()" (click)="handleDelete()" [disabled]="loading()">EXCLUIR</button>
              <button mat-raised-button color="primary" type="submit" [disabled]="telefoneForm.invalid || loading()">
                <mat-icon>{{ telefoneId() ? 'save' : 'add' }}</mat-icon>
                {{ telefoneId() ? 'ATUALIZAR' : 'ADICIONAR' }}
              </button>
            </div>
          </form>
        </mat-card-content>
      </mat-card>

      <div class="section">
        <h4>Telefones Registrados</h4>
        <div class="mat-elevation-z1">
          <table mat-table [dataSource]="telefones()" class="w-100">
            <ng-container matColumnDef="ddd">
              <th mat-header-cell *matHeaderCellDef> DDD </th>
              <td mat-cell *matCellDef="let t"> {{t.ddd}} </td>
            </ng-container>

            <ng-container matColumnDef="numero">
              <th mat-header-cell *matHeaderCellDef> Número </th>
              <td mat-cell *matCellDef="let t"> {{t.numero}} </td>
            </ng-container>

            <ng-container matColumnDef="descricao">
              <th mat-header-cell *matHeaderCellDef> Descrição </th>
              <td mat-cell *matCellDef="let t"> {{t.descricao}} </td>
            </ng-container>

            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef> </th>
              <td mat-cell *matCellDef="let t" class="text-right">
                <button mat-icon-button color="primary" (click)="handleSelect(t); $event.stopPropagation()" title="Editar">
                  <mat-icon>edit</mat-icon>
                </button>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="['ddd', 'numero', 'descricao', 'actions']"></tr>
            <tr mat-row *matRowDef="let row; columns: ['ddd', 'numero', 'descricao', 'actions'];" (click)="handleSelect(row)" class="clickable-row"></tr>
          </table>
        </div>
      </div>

      <div class="mt-20">
        <button mat-button (click)="handleBack()">RETORNAR</button>
      </div>
    </div>
  </div>
</div>
