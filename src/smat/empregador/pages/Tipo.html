<div class="container mat-typography">
  <h3>Tipos de Empregador</h3>

  <div *ngIf="loading()" class="acidente-loading">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Carregando...</p>
  </div>

  <div *ngIf="!loading()">
    <mat-card class="section">
      <mat-card-header>
        <mat-card-title>{{ selectedId() ? 'Editar' : 'Novo' }} Tipo de Empregador</mat-card-title>
      </mat-card-header>

      <mat-card-content class="mt-10">
        <form [formGroup]="tipoForm" (ngSubmit)="handleSave()" class="form-container">
          <div class="grid-form">
            <mat-form-field appearance="fill" class="w-100">
              <mat-label>Código</mat-label>
              <input matInput formControlName="codigo" placeholder="Ex: PF, PJ">
            </mat-form-field>

            <mat-form-field appearance="fill" class="w-100">
              <mat-label>Descrição</mat-label>
              <input matInput formControlName="descricao" placeholder="Ex: Pessoa Física, Pessoa Jurídica" required>
            </mat-form-field>
          </div>

          <div class="actions-container mt-10">
            <button mat-button type="button" (click)="handleClear()" [disabled]="loading()">LIMPAR</button>
            <button mat-raised-button color="warn" type="button" *ngIf="selectedId()" (click)="handleDelete()" [disabled]="loading()">EXCLUIR</button>
            <button mat-raised-button color="primary" type="submit" [disabled]="tipoForm.invalid || loading()">
              <mat-icon>{{ selectedId() ? 'save' : 'add' }}</mat-icon>
              {{ selectedId() ? 'ATUALIZAR' : 'CADASTRAR' }}
            </button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>

    <div class="section">
      <h4>Tipos Registrados</h4>
      <div class="mat-elevation-z1">
        <table mat-table [dataSource]="tipos()" class="w-100">
          <ng-container matColumnDef="codigo">
            <th mat-header-cell *matHeaderCellDef> Código </th>
            <td mat-cell *matCellDef="let t"> {{t.codigo}} </td>
          </ng-container>

          <ng-container matColumnDef="descricao">
            <th mat-header-cell *matHeaderCellDef> Descrição </th>
            <td mat-cell *matCellDef="let t"> {{t.descricao}} </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> </th>
            <td mat-cell *matCellDef="let t" class="text-right">
              <button mat-icon-button color="primary" (click)="handleSelect(t); $event.stopPropagation()" title="Editar">
                <mat-icon>edit</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="['codigo', 'descricao', 'actions']"></tr>
          <tr mat-row *matRowDef="let row; columns: ['codigo', 'descricao', 'actions'];" (click)="handleSelect(row)" class="clickable-row"></tr>
        </table>
      </div>
    </div>
  </div>
</div>
