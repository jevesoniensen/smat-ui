<div class="container mat-typography">
  <h3>Usuários e Grupos</h3>

  <div *ngIf="loading()" class="acidente-loading">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Carregando...</p>
  </div>

  <div *ngIf="!loading()">
    <mat-card class="section">
      <mat-card-header>
        <mat-card-title>Nova Associação</mat-card-title>
      </mat-card-header>
      <mat-card-content class="mt-10">
        <form (ngSubmit)="handleAssign()" class="form-container">
          <div class="grid-form">
            <mat-form-field appearance="fill" class="w-100">
              <mat-label>Usuário</mat-label>
              <mat-select [(ngModel)]="selectedUserId" name="selectedUserId" required>
                <mat-option value="">- selecione -</mat-option>
                <mat-option *ngFor="let user of usuarios()" [value]="user.id">{{ user.nome }}</mat-option>
              </mat-select>
            </mat-form-field>

            <mat-form-field appearance="fill" class="w-100">
              <mat-label>Grupo</mat-label>
              <mat-select [(ngModel)]="selectedGroupId" name="selectedGroupId" required>
                <mat-option value="">- selecione -</mat-option>
                <mat-option *ngFor="let group of grupos()" [value]="group.id">{{ group.nome }}</mat-option>
              </mat-select>
            </mat-form-field>
          </div>

          <div class="actions-container">
            <button mat-raised-button color="primary" type="submit" [disabled]="loading() || !selectedUserId || !selectedGroupId">
              <mat-icon>add_link</mat-icon> ASSOCIAR
            </button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>

    <h4 class="mt-20">Associações Atuais</h4>
    <div class="mat-elevation-z1">
      <table mat-table [dataSource]="assignments()" class="w-100">
        <ng-container matColumnDef="usuario">
          <th mat-header-cell *matHeaderCellDef> Usuário </th>
          <td mat-cell *matCellDef="let assign"> {{ (assign.usuario | any)?.nome || assign.usuarioId }} </td>
        </ng-container>

        <ng-container matColumnDef="grupo">
          <th mat-header-cell *matHeaderCellDef> Grupo </th>
          <td mat-cell *matCellDef="let assign"> {{ (assign.grupo | any)?.nome || assign.grupoId }} </td>
        </ng-container>

        <ng-container matColumnDef="acao">
          <th mat-header-cell *matHeaderCellDef> </th>
          <td mat-cell *matCellDef="let assign" class="text-right">
            <button mat-icon-button color="warn" (click)="handleRemove(assign)" [disabled]="loading()" title="Remover">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['usuario', 'grupo', 'acao']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['usuario', 'grupo', 'acao'];"></tr>
      </table>
    </div>
  </div>
</div>
