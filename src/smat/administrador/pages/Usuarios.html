<div class="container mat-typography">
  <h3>Cadastro de Usuários</h3>

  <div *ngIf="loading()" class="acidente-loading">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Carregando...</p>
  </div>

  <div *ngIf="!loading()">
    <mat-card class="section">
      <mat-card-header>
        <mat-card-title>{{ selectedId() ? 'Editar Usuário' : 'Novo Usuário' }}</mat-card-title>
      </mat-card-header>
      <mat-card-content class="mt-10">
        <form [formGroup]="usuarioForm" (ngSubmit)="handleSave()" class="form-container">
          <div class="grid-form">
            <mat-form-field appearance="fill" class="w-100">
              <mat-label>Login</mat-label>
              <input matInput formControlName="login" required>
            </mat-form-field>

            <mat-form-field appearance="fill" class="w-100">
              <mat-label>Agente de Saúde</mat-label>
              <mat-select formControlName="agenteSaudeId">
                <mat-option value="">- selecione -</mat-option>
                <mat-option *ngFor="let a of agentesSaude()" [value]="a.id">{{ a.nome }}</mat-option>
              </mat-select>
            </mat-form-field>
          </div>

          <div class="grid-form">
            <mat-form-field appearance="fill" class="w-100">
              <mat-label>Senha</mat-label>
              <input matInput type="password" formControlName="senha">
            </mat-form-field>

            <mat-form-field appearance="fill" class="w-100">
              <mat-label>Redigite a senha</mat-label>
              <input matInput type="password" formControlName="senhaConfirm">
            </mat-form-field>
          </div>

          <div class="actions-container">
            <button mat-button type="button" (click)="handleClear()" [disabled]="loading()">LIMPAR</button>
            <button mat-raised-button color="warn" type="button" *ngIf="selectedId()" (click)="handleDelete()" [disabled]="loading()">EXCLUIR</button>
            <button mat-raised-button color="primary" type="submit" [disabled]="usuarioForm.invalid || loading()">
              <mat-icon>{{ selectedId() ? 'save' : 'add' }}</mat-icon>
              {{ selectedId() ? 'ATUALIZAR' : 'GRAVAR' }}
            </button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>

    <h4 class="mt-20">Usuários Cadastrados</h4>
    <div class="mat-elevation-z1">
      <table mat-table [dataSource]="usuarios()" class="w-100">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> ID </th>
          <td mat-cell *matCellDef="let user"> {{ user.id }} </td>
        </ng-container>

        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef> Nome </th>
          <td mat-cell *matCellDef="let user"> {{ user.nome }} </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> </th>
          <td mat-cell *matCellDef="let user" class="text-right">
            <button mat-icon-button color="primary" (click)="handleSelect(user)" title="Editar">
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['id', 'nome', 'actions']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['id', 'nome', 'actions'];" class="clickable-row"></tr>
      </table>
    </div>
  </div>
</div>
