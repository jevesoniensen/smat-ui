<div class="container mat-typography">
  <h3>Telefones da Regional</h3>
  
  <div *ngIf="message()" class="alert alert-info mb-20">{{ message() }}</div>

  <div *ngIf="!regionalId()" class="alert error mb-20">
    <mat-icon>error</mat-icon> Regional não especificada.
  </div>

  <mat-card *ngIf="regionalId()">
    <mat-card-header>
      <mat-card-title>{{ selectedId() ? 'Editar' : 'Novo' }} Telefone</mat-card-title>
    </mat-card-header>
    <mat-card-content class="mt-10">
      <form [formGroup]="telefoneForm" (ngSubmit)="handleSave()" class="form-container">
        
        <mat-form-field appearance="fill" class="w-100">
          <mat-label>Número</mat-label>
          <input matInput formControlName="numero" maxLength="20" required>
        </mat-form-field>

        <mat-form-field appearance="fill" class="w-100">
          <mat-label>Ramal</mat-label>
          <input matInput formControlName="ramal" maxLength="10">
        </mat-form-field>

        <div class="form-actions">
          <button mat-button type="button" (click)="handleBack()">
            <mat-icon>arrow_back</mat-icon> VOLTAR
          </button>
          <button mat-raised-button color="primary" type="submit" [disabled]="loading() || telefoneForm.invalid">
            <mat-icon>save</mat-icon> GRAVAR
          </button>
          <button mat-button type="button" (click)="handleClear()" [disabled]="loading()">
            <mat-icon>clear</mat-icon> LIMPAR
          </button>
          <button mat-raised-button color="warn" type="button" (click)="handleDelete()" [disabled]="loading() || !selectedId()">
            <mat-icon>delete</mat-icon> EXCLUIR
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>

  <div class="section mt-30" *ngIf="telefones().length > 0">
    <h4>Telefones Cadastrados</h4>
    <table mat-table [dataSource]="telefones()" class="mat-elevation-z1 w-100">
      
      <ng-container matColumnDef="numero">
        <th mat-header-cell *matHeaderCellDef> Número </th>
        <td mat-cell *matCellDef="let item"> {{ item.numero }} </td>
      </ng-container>

      <ng-container matColumnDef="ramal">
        <th mat-header-cell *matHeaderCellDef> Ramal </th>
        <td mat-cell *matCellDef="let item"> {{ item.ramal }} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="handleSelect(row)" class="clickable-row" [class.selected-row]="selectedId() === row.id"></tr>
    </table>
  </div>
</div>
