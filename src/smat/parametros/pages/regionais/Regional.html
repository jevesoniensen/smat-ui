<div class="container mat-typography">
  <h3>Cadastro de Regionais</h3>
  
  <div *ngIf="message()" class="alert alert-info mb-20">{{ message() }}</div>

  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ selectedId() ? 'Editar' : 'Novo' }} Regional</mat-card-title>
    </mat-card-header>
    <mat-card-content class="mt-10">
      <form [formGroup]="regionalForm" (ngSubmit)="handleSave()" class="form-container">
        
        <mat-form-field appearance="fill" class="w-100" *ngIf="selectedId()">
          <mat-label>ID</mat-label>
          <input matInput [value]="selectedId()" disabled>
        </mat-form-field>

        <mat-form-field appearance="fill" class="w-100">
          <mat-label>Nome</mat-label>
          <input matInput formControlName="nome" maxLength="100" required>
        </mat-form-field>

        <mat-form-field appearance="fill" class="w-100">
          <mat-label>Endereço</mat-label>
          <input matInput formControlName="endereco" maxLength="255">
        </mat-form-field>

        <div class="form-actions">
          <button mat-raised-button color="primary" type="submit" [disabled]="loading() || regionalForm.invalid">
            <mat-icon>save</mat-icon> GRAVAR
          </button>
          <button mat-button type="button" (click)="handleClear()" [disabled]="loading()">
            <mat-icon>clear</mat-icon> LIMPAR
          </button>
          <button mat-raised-button color="warn" type="button" (click)="handleDelete()" [disabled]="loading() || !selectedId()">
            <mat-icon>delete</mat-icon> EXCLUIR
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>

  <div class="section mt-30">
    <h4>Regionais Cadastradas</h4>
    <table mat-table [dataSource]="items()" class="mat-elevation-z1 w-100">
      
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let item"> {{ item.nome }} </td>
      </ng-container>

      <ng-container matColumnDef="endereco">
        <th mat-header-cell *matHeaderCellDef> Endereço </th>
        <td mat-cell *matCellDef="let item"> {{ item.endereco }} </td>
      </ng-container>

      <ng-container matColumnDef="telefones">
        <th mat-header-cell *matHeaderCellDef> Telefones </th>
        <td mat-cell *matCellDef="let item">
          <button mat-stroked-button color="primary" (click)="$event.stopPropagation(); handleManageTelefones(item.id)">
            <mat-icon>phone</mat-icon> Gerenciar
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="handleSelect(row)" class="clickable-row" [class.selected-row]="selectedId() === row.id"></tr>
    </table>
  </div>
</div>
