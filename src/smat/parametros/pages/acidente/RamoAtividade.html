<div class="container mat-typography">
  <h3>Cadastro de Ramos de Atividade</h3>
  
  <div *ngIf="message()" class="alert alert-info mb-20">{{ message() }}</div>

  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ selectedId() ? 'Editar' : 'Novo' }} Ramo de Atividade</mat-card-title>
    </mat-card-header>
    <mat-card-content class="mt-10">
      <form [formGroup]="ramoForm" (ngSubmit)="handleSave()" class="form-container">
        
        <mat-form-field appearance="fill" class="w-100">
          <mat-label>Nível</mat-label>
          <mat-select formControlName="parentId" [disabled]="!!selectedId()">
            <mat-option value="">-- Nível 1 --</mat-option>
            <mat-option *ngFor="let p of parentItems()" [value]="p.id">{{ p.nome }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="fill" class="w-100">
          <mat-label>Nome</mat-label>
          <input matInput formControlName="nome" maxLength="100" required>
        </mat-form-field>

        <mat-form-field appearance="fill" class="w-100">
          <mat-label>CNAE</mat-label>
          <input matInput formControlName="cnae" maxLength="5">
        </mat-form-field>

        <div class="form-actions">
          <button mat-raised-button color="primary" type="submit" [disabled]="loading() || ramoForm.invalid">
            <mat-icon>save</mat-icon> GRAVAR
          </button>
          <button mat-button type="button" (click)="handleClear()" [disabled]="loading()">
            <mat-icon>clear</mat-icon> LIMPAR
          </button>
          <button mat-raised-button color="warn" type="button" (click)="handleDelete()" [disabled]="loading() || !selectedId()">
            <mat-icon>delete</mat-icon> EXCLUIR
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>

  <div class="section mt-30">
    <h4>Ramos de Atividade Cadastrados</h4>
    <table mat-table [dataSource]="items()" class="mat-elevation-z1 w-100">
      
      <ng-container matColumnDef="area">
        <th mat-header-cell *matHeaderCellDef> Área de atuação </th>
        <td mat-cell *matCellDef="let item"> {{ item.nome }} </td>
      </ng-container>

      <ng-container matColumnDef="ramo">
        <th mat-header-cell *matHeaderCellDef> Ramo de atividade </th>
        <td mat-cell *matCellDef="let item"> {{ getParentName(item.ramoSuperior) }} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="handleSelect(row)" class="clickable-row" [class.selected-row]="selectedId() === row.id"></tr>
    </table>
  </div>
</div>
