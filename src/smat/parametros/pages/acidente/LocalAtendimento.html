<div class="container mat-typography">
  <h3>Cadastro de Locais de Atendimento</h3>
  
  <div *ngIf="message()" class="alert alert-info mb-20">{{ message() }}</div>

  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ selectedId() ? 'Editar' : 'Novo' }} Local de Atendimento</mat-card-title>
    </mat-card-header>
    <mat-card-content class="mt-10">
      <form [formGroup]="atendimentoForm" (ngSubmit)="handleSave()" class="form-container">
        
        <mat-form-field appearance="fill" class="w-100">
          <mat-label>Nome</mat-label>
          <input matInput formControlName="nome" maxLength="80" required>
        </mat-form-field>

        <mat-form-field appearance="fill" class="w-100">
          <mat-label>Estado</mat-label>
          <mat-select formControlName="estadoId" (selectionChange)="onEstadoChange()" required>
            <mat-option value="">-- Estado --</mat-option>
            <mat-option *ngFor="let e of estados()" [value]="e.id">{{ e.nome }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="fill" class="w-100">
          <mat-label>Município</mat-label>
          <mat-select formControlName="municipioId" required [disabled]="!atendimentoForm.get('estadoId')?.value || municipios().length === 0">
            <mat-option value="">-- Município --</mat-option>
            <mat-option *ngFor="let m of municipios()" [value]="m.id">{{ m.nome }}</mat-option>
          </mat-select>
        </mat-form-field>

        <div class="form-actions">
          <button mat-raised-button color="primary" type="submit" [disabled]="loading() || atendimentoForm.invalid">
            <mat-icon>save</mat-icon> GRAVAR
          </button>
          <button mat-button type="button" (click)="handleClear()" [disabled]="loading()">
            <mat-icon>clear</mat-icon> LIMPAR
          </button>
          <button mat-raised-button color="warn" type="button" (click)="handleDelete()" [disabled]="loading() || !selectedId()">
            <mat-icon>delete</mat-icon> EXCLUIR
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>

  <div class="section mt-30">
    <h4>Locais de Atendimento Cadastrados</h4>
    <table mat-table [dataSource]="items()" class="mat-elevation-z1 w-100">
      
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef> Local de atendimento </th>
        <td mat-cell *matCellDef="let item"> {{ item.nome }} </td>
      </ng-container>

      <ng-container matColumnDef="municipio">
        <th mat-header-cell *matHeaderCellDef> Município </th>
        <td mat-cell *matCellDef="let item"> <!-- Municipio name logic --> </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="handleSelect(row)" class="clickable-row" [class.selected-row]="selectedId() === row.id"></tr>
    </table>
  </div>
</div>
