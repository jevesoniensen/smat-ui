<div class="container mat-typography">
  <h3>Cadastro de Itens de Fiscalização</h3>
  
  <div *ngIf="message()" class="alert alert-info mb-20">{{ message() }}</div>

  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ selectedId() ? 'Editar' : 'Novo' }} Item de Fiscalização</mat-card-title>
    </mat-card-header>
    <mat-card-content class="mt-10">
      <form [formGroup]="itemForm" (ngSubmit)="handleSave()" class="form-container">
        
        <mat-form-field appearance="fill" class="w-100" *ngIf="selectedId()">
          <mat-label>ID</mat-label>
          <input matInput [value]="selectedId()" disabled>
        </mat-form-field>

        <mat-form-field appearance="fill" class="w-100">
          <mat-label>Descrição</mat-label>
          <input matInput formControlName="descricao" maxLength="255" required>
        </mat-form-field>

        <mat-form-field appearance="fill" class="w-100">
          <mat-label>Norma Relacionada</mat-label>
          <input matInput formControlName="normaRelacionada" maxLength="100">
        </mat-form-field>

        <div class="form-actions">
          <button mat-raised-button color="primary" type="submit" [disabled]="loading() || itemForm.invalid">
            <mat-icon>save</mat-icon> GRAVAR
          </button>
          <button mat-button type="button" (click)="handleClear()" [disabled]="loading()">
            <mat-icon>clear</mat-icon> LIMPAR
          </button>
          <button mat-raised-button color="warn" type="button" (click)="handleDelete()" [disabled]="loading() || !selectedId()">
            <mat-icon>delete</mat-icon> EXCLUIR
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>

  <div class="section mt-30">
    <h4>Itens de Fiscalização Cadastrados</h4>
    <table mat-table [dataSource]="items()" class="mat-elevation-z1 w-100">
      
      <ng-container matColumnDef="descricao">
        <th mat-header-cell *matHeaderCellDef> Descrição </th>
        <td mat-cell *matCellDef="let item"> {{ item.descricao }} </td>
      </ng-container>

      <ng-container matColumnDef="normaRelacionada">
        <th mat-header-cell *matHeaderCellDef> Norma Relacionada </th>
        <td mat-cell *matCellDef="let item"> {{ item.normaRelacionada }} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="handleSelect(row)" class="clickable-row" [class.selected-row]="selectedId() === row.id"></tr>
    </table>
  </div>
</div>
