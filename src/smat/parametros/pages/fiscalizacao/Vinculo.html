<div class="container mat-typography">
  <h3>Vínculo Item de Fiscalização / Ponto de Fiscalização</h3>
  
  <div *ngIf="message()" class="alert alert-info mb-20">{{ message() }}</div>

  <mat-card class="mb-20">
    <mat-card-content>
      <mat-form-field appearance="fill" class="w-100">
        <mat-label>Ponto de fiscalização</mat-label>
        <mat-select [(ngModel)]="selectedPontoId" (selectionChange)="onPontoChange()">
          <mat-option value="">-- Selecione o Ponto --</mat-option>
          <mat-option *ngFor="let p of pontos()" [value]="p.id">{{ p.descricao }}</mat-option>
        </mat-select>
      </mat-form-field>
    </mat-card-content>
  </mat-card>

  <div *ngIf="selectedPontoId">
    <div class="form-actions mb-20">
      <button mat-raised-button color="primary" (click)="handleSave()" [disabled]="loading()">
        <mat-icon>save</mat-icon> GRAVAR VÍNCULOS
      </button>
    </div>

    <div class="section mt-30">
      <h4>Itens de Fiscalização</h4>
      <table mat-table [dataSource]="allItems()" class="mat-elevation-z1 w-100">
        
        <ng-container matColumnDef="select">
          <th mat-header-cell *matHeaderCellDef class="w-50px"> Selecionar </th>
          <td mat-cell *matCellDef="let item">
            <mat-checkbox
              [checked]="isLinked(item.id)"
              (change)="toggleLink(item.id)"
            ></mat-checkbox>
          </td>
        </ng-container>

        <ng-container matColumnDef="descricao">
          <th mat-header-cell *matHeaderCellDef> Descrição </th>
          <td mat-cell *matCellDef="let item"> {{ item.descricao }} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  </div>
</div>
