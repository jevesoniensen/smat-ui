<div class="container mat-typography">
  <h3>Agentes de Saúde</h3>

  <mat-card class="section">
    <mat-card-header>
      <mat-card-title>{{ agenteId() ? 'Editar' : 'Novo' }} Agente de Saúde</mat-card-title>
    </mat-card-header>

    <mat-card-content class="mt-10">
      <form [formGroup]="agenteForm" (ngSubmit)="handleSave()" class="form-container">
        <div class="grid-form">
          <mat-form-field appearance="fill" class="w-100">
            <mat-label>Nome Completo</mat-label>
            <input matInput formControlName="nome" placeholder="Nome do Agente">
          </mat-form-field>

          <mat-form-field appearance="fill" class="w-100">
            <mat-label>E-mail</mat-label>
            <input matInput type="email" formControlName="email" placeholder="email@exemplo.com">
          </mat-form-field>
        </div>

        <div class="grid-form">
          <mat-form-field appearance="fill" class="w-100">
            <mat-label>Estado</mat-label>
            <mat-select formControlName="estadoId" (selectionChange)="onEstadoChange()">
              <mat-option *ngFor="let e of estados()" [value]="e.id">{{ e.nome }}</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="fill" class="w-100">
            <mat-label>Regional</mat-label>
            <mat-select formControlName="regionalId">
              <mat-option *ngFor="let r of regionais()" [value]="r.id">{{ r.nome }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <div class="actions-container mt-10">
          <button mat-button type="button" (click)="handleClear()" [disabled]="loading()">LIMPAR</button>
          <button mat-raised-button color="warn" type="button" *ngIf="agenteId()" (click)="handleDelete()" [disabled]="loading()">EXCLUIR</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="agenteForm.invalid || loading()">
            {{ agenteId() ? 'ATUALIZAR' : 'CADASTRAR' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>

  <div class="section">
    <h4>Agentes Registrados</h4>
    <table mat-table [dataSource]="agentes()" class="mat-elevation-z1 w-100">
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let a"> {{a.nome}} </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> E-mail </th>
        <td mat-cell *matCellDef="let a"> {{a.email}} </td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef> Estado </th>
        <td mat-cell *matCellDef="let a"> {{a.estadoId}} </td>
      </ng-container>

      <ng-container matColumnDef="regional">
        <th mat-header-cell *matHeaderCellDef> Regional </th>
        <td mat-cell *matCellDef="let a"> {{a.regionalId}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="handleSelect(row)" class="clickable-row"></tr>
    </table>
  </div>
</div>
