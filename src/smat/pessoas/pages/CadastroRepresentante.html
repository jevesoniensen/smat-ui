<div class="container mat-typography">
  <h3>Representantes da Empresa</h3>

  <div *ngIf="!empregadorId()" class="alert error">
    <mat-icon>error</mat-icon>
    Contexto do empregador não encontrado.
    <button mat-button (click)="handleReturn()">Voltar</button>
  </div>

  <div *ngIf="empregadorId()">
    <mat-card class="section">
      <mat-card-header>
        <mat-card-title>{{ selectedId() ? 'Editar' : 'Novo' }} Representante</mat-card-title>
        <mat-card-subtitle>Empresa: {{ empregadorNome() }}</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content class="mt-10">
        <form [formGroup]="representanteForm" (ngSubmit)="handleSave()" class="form-container">
          <mat-form-field appearance="fill" class="w-100">
            <mat-label>Nome do Representante</mat-label>
            <input matInput formControlName="nome" placeholder="Nome Completo">
          </mat-form-field>

          <div class="actions-container mt-10">
            <button mat-button type="button" (click)="handleClear()" [disabled]="loading()">LIMPAR</button>
            <button mat-raised-button color="warn" type="button" *ngIf="selectedId()" (click)="handleDelete()" [disabled]="loading()">EXCLUIR</button>
            <button mat-raised-button color="primary" type="submit" [disabled]="representanteForm.invalid || loading()">
              {{ selectedId() ? 'ATUALIZAR' : 'CADASTRAR' }}
            </button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>

    <div class="section">
      <h4>Representantes Registrados</h4>
      <table mat-table [dataSource]="representantes()" class="mat-elevation-z1 w-100">
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef> Nome </th>
          <td mat-cell *matCellDef="let r"> {{r.nome}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="handleSelect(row)" class="clickable-row"></tr>
      </table>
    </div>

    <div class="mt-20">
      <button mat-button (click)="handleReturn()">RETORNAR</button>
    </div>
  </div>
</div>
