<div class="container mat-typography">
  <h3>Pesquisa de Pessoas</h3>

  <mat-card class="section">
    <mat-card-header>
      <mat-card-title>Filtros de Pesquisa</mat-card-title>
    </mat-card-header>

    <mat-card-content class="mt-10">
      <div class="form-container">
        <mat-form-field appearance="fill" class="w-100">
          <mat-label>Nome</mat-label>
          <input matInput [(ngModel)]="nome" placeholder="Parte do nome">
        </mat-form-field>

        <mat-form-field appearance="fill" class="w-100">
          <mat-label>Tipo de Depoimento</mat-label>
          <mat-select [(ngModel)]="tipoDepoimentoId">
            <mat-option value="">- todos -</mat-option>
            <mat-option *ngFor="let t of tiposDepoimento()" [value]="t.id">{{ t.nome }}</mat-option>
          </mat-select>
        </mat-form-field>

        <div class="actions-container">
          <button mat-raised-button color="primary" (click)="handleSearch()" [disabled]="loading()">
            <mat-icon>search</mat-icon> PESQUISAR
          </button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>

  <div class="section" *ngIf="resultados().length > 0">
    <h4>Resultados</h4>
    <table mat-table [dataSource]="resultados()" class="mat-elevation-z1 w-100">
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let p"> {{p.nome}} </td>
      </ng-container>

      <ng-container matColumnDef="tipo">
        <th mat-header-cell *matHeaderCellDef> Tipo </th>
        <td mat-cell *matCellDef="let p"> {{p.tipoDepoimento?.nome}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="handleSelect(row)" class="clickable-row"></tr>
    </table>
  </div>

  <div class="mt-20">
    <button mat-stroked-button color="accent" (click)="handleCreate()" class="mr-10">
        <mat-icon>add</mat-icon> NOVA TESTEMUNHA
    </button>
    <button mat-button (click)="handleReturn()">RETORNAR</button>
  </div>
</div>
